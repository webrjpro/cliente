<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal do Cliente CrediGestor — Acompanhe seus empréstimos e solicite crédito">
  <title>CrediGestor — Portal do Cliente</title>
  <link rel="stylesheet" href="css/portal.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CrediGestor">
</head>
<body>
  <!-- ═══ Toast Container ═══ -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ═══ LOGIN PAGE ═══ -->
  <div id="page-login" class="login-container">
    <div class="login-box fade-in">
      <div class="logo-big">
        <div class="icon">💎</div>
        <h1>CrediGestor</h1>
        <p>Portal do Cliente</p>
      </div>
      <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
        <div id="login-error" class="login-error"></div>
        <div>
          <label class="input-label" for="login-email">E-mail</label>
          <input type="email" id="login-email" class="input-field" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div>
          <label class="input-label" for="login-password">Senha</label>
          <input type="password" id="login-password" class="input-field" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-brand" id="btn-login" style="width:100%;padding:14px">
          Entrar
        </button>
        <p style="text-align:center;color:var(--text-muted);font-size:0.8rem">
          Credenciais fornecidas pelo seu gestor
        </p>
      </form>
    </div>
  </div>

  <!-- ═══ APP (LOGGED IN) ═══ -->
  <div id="app-shell" class="hidden">
    <!-- Mobile Header -->
    <div class="mobile-header">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <span style="font-weight:800;background:var(--gradient-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CrediGestor</span>
      <button class="menu-toggle" onclick="handleLogout()">⏻</button>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">💎</div>
        <div class="logo-text">CrediGestor</div>
      </div>
      <nav id="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
          <span>📊</span> Dashboard
        </a>
        <a class="nav-item" data-page="margens" onclick="navigate('margens')">
          <span>📈</span> Minhas Margens
        </a>
        <a class="nav-item" data-page="solicitar" onclick="navigate('solicitar')">
          <span>💰</span> Solicitar Crédito
        </a>
        <a class="nav-item" data-page="pedidos" onclick="navigate('pedidos')">
          <span>📋</span> Meus Pedidos
          <span class="nav-badge hidden" id="badge-pedidos">0</span>
        </a>
        <a class="nav-item" data-page="contratos" onclick="navigate('contratos')">
          <span>📄</span> Meus Contratos
        </a>
        <a class="nav-item" data-page="calendario" onclick="navigate('calendario')">
          <span>📅</span> Calendário
        </a>
        <a class="nav-item" data-page="notificacoes" onclick="navigate('notificacoes')">
          <span>🔔</span> Notificações
          <span class="nav-badge hidden" id="badge-notif">0</span>
        </a>
        <a class="nav-item" data-page="perfil" onclick="navigate('perfil')">
          <span>👤</span> Meu Perfil
        </a>
      </nav>
      <div style="margin-top:auto;padding:16px;border-top:1px solid var(--border-glass)">
        <div style="display:flex;gap:6px;margin-bottom:10px">
          <button id="btn-toggle-theme" onclick="toggleTema()" title="Alternar tema claro/escuro" style="flex:1;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:8px;padding:6px;cursor:pointer;font-size:1rem">☀️</button>
          <button onclick="abrirFAQ()" title="Perguntas frequentes" style="flex:1;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:8px;padding:6px;cursor:pointer;font-size:1rem">❓</button>
        </div>
        <div style="font-size:0.85rem;font-weight:700;color:var(--text-primary);margin-bottom:2px" id="user-name">Cliente</div>
        <div style="font-size:0.75rem;color:var(--text-muted)" id="user-email">email@email.com</div>
        <button class="btn-ghost" style="width:100%;margin-top:12px;font-size:0.8rem;padding:8px" onclick="handleLogout()">
          Sair da Conta
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      <div class="page-loader"><div class="spinner"></div></div>
    </main>
  </div>

  <!-- ═══ Modal Solicitar Empréstimo ═══ -->
  <div class="modal-overlay" id="modal-solicitar">
    <div class="modal-content">
      <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:20px">Nova Solicitação de Crédito</h2>
      <form id="form-solicitar" onsubmit="submitSolicitacao(event)">
        <div style="margin-bottom:16px">
          <label class="input-label">Valor desejado (R$)</label>
          <input type="number" id="sol-valor" class="input-field" placeholder="1000.00" min="1" step="0.01" required>
        </div>
        <div class="grid-2" style="margin-bottom:16px">
          <div>
            <label class="input-label">Tipo</label>
            <select id="sol-tipo" class="input-field">
              <option value="avulso">Avulso</option>
              <option value="parcelado">Parcelado</option>
              <option value="cartao">Cartão</option>
            </select>
          </div>
          <div>
            <label class="input-label">Parcelas</label>
            <select id="sol-parcelas" class="input-field">
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="3">3x</option>
              <option value="4">4x</option>
              <option value="5">5x</option>
              <option value="6">6x</option>
              <option value="10">10x</option>
              <option value="12">12x</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:20px">
          <label class="input-label">Observação (opcional)</label>
          <textarea id="sol-obs" class="input-field" rows="2" placeholder="Motivo ou observação..."></textarea>
        </div>
        <div style="display:flex;gap:12px">
          <button type="button" class="btn-ghost" style="flex:1" onclick="closeModal('modal-solicitar')">Cancelar</button>
          <button type="submit" class="btn-brand" style="flex:1" id="btn-submit-sol">Enviar Solicitação</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <!-- PWA: registra service worker (cache offline + installable) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('[PWA] SW falhou:', err));
      });
    }
  </script>
</body>
</html>
